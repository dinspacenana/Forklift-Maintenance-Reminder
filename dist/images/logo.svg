<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4B7A" />
      <stop offset="100%" stop-color="#3A75A4" />
    </linearGradient>
    <linearGradient id="yellowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Circular Arrow Ring Badge -->
  <g transform="translate(4, 2)">
    <!-- Outer circle background -->
    <circle cx="28" cy="28" r="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Top blue curved arrow -->
    <path d="M 12 26 A 18 18 0 0 1 44 26" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="43,21 48,27 41,29" fill="#2563EB"/>

    <!-- Bottom yellow curved arrow -->
    <path d="M 44 30 A 18 18 0 0 1 12 30" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="13,35 8,29 15,27" fill="#F59E0B"/>

    <!-- Forklift Vehicle Silhouette -->
    <g transform="translate(14, 15) scale(0.68)">
      <!-- Body & Cab -->
      <path d="M 6 22 L 6 12 Q 6 6 12 6 L 22 6 Q 24 6 25 8 L 29 15 L 32 15 Q 34 15 34 18 L 34 24 L 2 24 L 2 22 Z" fill="#1E3A8A"/>
      <!-- Window -->
      <path d="M 10 9 L 20 9 L 26 15 L 10 15 Z" fill="#DBEAFE"/>
      <!-- Seat / Steering -->
      <rect x="13" y="16" width="3" height="5" rx="1" fill="#FFFFFF"/>
      <!-- Mast & Fork -->
      <rect x="33" y="2" width="3" height="24" rx="1" fill="#475569"/>
      <path d="M 33 22 L 44 22 L 44 24 L 33 24 Z" fill="#475569"/>
      <!-- Cargo Box on Fork -->
      <rect x="36" y="11" width="10" height="11" rx="1" fill="#F59E0B" stroke="#D97706" stroke-width="0.8"/>
      <line x1="41" y1="11" x2="41" y2="22" stroke="#D97706" stroke-width="0.8"/>
      <!-- Wheels -->
      <circle cx="9" cy="24" r="4.5" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="9" cy="24" r="1.5" fill="#FFFFFF"/>
      <circle cx="28" cy="24" r="4.5" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="28" cy="24" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(68, 12)">
    <!-- FMR in stylized italic serif font -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="25" font-weight="900" font-style="italic" letter-spacing="1.5" fill="#0F172A">FMR</text>
    <!-- Subtitle -->
    <text x="0" y="37" font-family="'Poppins', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.2" fill="#64748B">Forklift Maintenance Reminder</text>
  </g>
</svg>
