<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <clipPath id="avatarClip">
      <circle cx="80" cy="80" r="80" />
    </clipPath>
  </defs>

  <g clip-path="url(#avatarClip)">
    <!-- Background -->
    <rect width="160" height="160" fill="url(#bgGrad)" />

    <!-- Vintage Portrait Figure (Andi Wijaya) -->
    <!-- Coat / Shoulders -->
    <path d="M 20 160 Q 40 115 80 115 Q 120 115 140 160 Z" fill="#1E293B" />
    <!-- White Shirt Collar & Tie -->
    <path d="M 68 115 L 80 140 L 92 115 Z" fill="#E2E8F0" />
    <polygon points="76,120 84,120 82,145 78,145" fill="#0F172A" />
    <path d="M 64 112 L 76 122 L 68 128 Z" fill="#FFFFFF" />
    <path d="M 96 112 L 84 122 L 92 128 Z" fill="#FFFFFF" />

    <!-- Neck -->
    <rect x="71" y="90" width="18" height="25" rx="3" fill="#D4D4D8" />

    <!-- Head & Face -->
    <ellipse cx="80" cy="68" rx="26" ry="32" fill="#E4E4E7" />

    <!-- Hair (classic parted) -->
    <path d="M 52 65 Q 52 35 80 35 Q 108 35 108 65 Q 108 42 80 40 Q 55 42 52 65 Z" fill="#27272A" />
    <path d="M 52 60 Q 48 75 55 85 Q 56 68 59 60 Z" fill="#27272A" />
    <path d="M 108 60 Q 112 75 105 85 Q 104 68 101 60 Z" fill="#27272A" />

    <!-- Facial Features -->
    <!-- Eyebrows -->
    <path d="M 64 56 Q 71 53 76 56" stroke="#3F3F46" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 84 56 Q 89 53 96 56" stroke="#3F3F46" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="70" cy="63" rx="3.5" ry="2.2" fill="#18181B" />
    <ellipse cx="90" cy="63" rx="3.5" ry="2.2" fill="#18181B" />

    <!-- Nose -->
    <path d="M 80 61 L 78 74 L 83 75" stroke="#71717A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth -->
    <path d="M 72 84 Q 80 88 88 84" stroke="#52525B" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Ears -->
    <ellipse cx="54" cy="68" rx="3" ry="7" fill="#D4D4D8" />
    <ellipse cx="106" cy="68" rx="3" ry="7" fill="#D4D4D8" />
  </g>
</svg>
